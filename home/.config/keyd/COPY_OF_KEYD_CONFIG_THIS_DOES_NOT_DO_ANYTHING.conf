[ids]

*

[main]

capslock = overload(control, oneshot(alt))

# Danish letters are sent as AltGr keypresses rather than keyd's Unicode
# (compose) output, which Firefox turns into IME composition events that some
# web editors (e.g. Google Keep) mishandle. Requires the X11 layout us(altgr-intl)
[control]

a = G-w
o = G-l
' = G-z

[alt]

a = G-w
o = G-l
' = G-z
